<!-- Pagefind Search Integration -->
<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>

<script>
  window.addEventListener('load', (event) => {
    new PagefindUI({
      element: "#search",
      showSubResults: true,
      showImages: false,
      translations: {
        placeholder: "Search docs..."
      },
      autofocus: false
    });

    // Keyboard shortcut to focus search
    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        const searchInput = document.querySelector('.pagefind-ui__search-input');
        if (searchInput) {
          searchInput.focus();
        }
      }
    });

    // Make it work with existing .search-expandable logic
    const searchEl = document.getElementById('search');
    searchEl.addEventListener('focusin', () => {
       searchEl.classList.add('is-expanded');
    });
    searchEl.addEventListener('focusout', (e) => {
       if (!searchEl.contains(e.relatedTarget)) {
         searchEl.classList.remove('is-expanded');
       }
    });
  });
</script>

<style>
